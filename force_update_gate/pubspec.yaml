name: force_update_gate
description: A drop-in Flutter widget that gates your app behind a force-update screen when a newer version is published on the App Store / Play Store. No Firebase, no backend.
version: 0.3.0
publish_to: "none"

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  upgrader: ^14.0.0
  url_launcher: ^6.2.0
  package_info_plus: ">=9.0.0 <11.0.0"
  shared_preferences: ^2.5.0
  in_app_update: ^5.0.0
  material_ui: ^1.11.1
  cupertino_ui: ^1.1.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.4
