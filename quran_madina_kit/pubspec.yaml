name: quran_madina_kit
description: Renders Quran pages visually identical to the printed Madina Mushaf without images, driven by pre-computed JSON databases. A Flutter port of the quran-madina-html web runtime.
version: 0.1.0
publish_to: "none"

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter

  # Decorative sura-title frame (assets/img/sura_border_sym4.svg), recoloured to
  # the ambient text colour — the web's mask-image + currentColor trick.
  flutter_svg: ^2.0.9

  # MadinaNetworkSource: fetches manifest/juz shards from a CDN.
  http: ^1.2.0

  # The translate action opens quran.com inside the app rather than handing the
  # user off to a browser. Official package: Android + iOS. Every other platform
  # gets the copy-link fallback in MadinaWebPage.
  webview_flutter: ^4.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  assets:
    - assets/img/
    - assets/fonts/
    - assets/db/Madina05-Amiri_Quran-16px/
    - assets/db/Madina05-Amiri_Quran-24px/
    - assets/db/Madina05-Amiri_Quran_Colored-16px/
    - assets/db/Madina05-Amiri_Quran_Colored-24px/
    - assets/db/Madina05-Hafs-16px/
    - assets/db/Madina05-Hafs-24px/
    - assets/db/Madina05-Uthman-16px/
    - assets/db/Madina05-Uthman-24px/
    - assets/db/Madina05-me_quran-16px/
    - assets/db/Madina05-me_quran-24px/
