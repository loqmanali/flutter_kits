name: confirm_kit
description: A project-agnostic confirmation-dialog toolkit for Flutter — intents (destructive/success/warning/info), 1..N actions with async loading, dialog / bottom-sheet / inline surfaces, and a ThemeExtension for app-wide styling.
version: 1.0.0
publish_to: "none"

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
