name: adaptive_kit
description: >-
  Unified phone/tablet/desktop layout kit. Two complementary APIs on one kit:
  (1) an Adaptive singleton + AdaptiveBuilder + AdaptiveLayout (widget-based,
  readable without a BuildContext); and (2) context-based helpers
  (context.isTablet, responsivePadding…) plus ResponsiveLayout / ResponsiveGrid
  / ResponsiveContent / ResponsiveBuilder / ResponsiveVisibility. Depends only
  on Flutter, so it can be reused across apps.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.8.0
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
