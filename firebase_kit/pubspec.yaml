name: firebase_kit
description: Self-contained, project-agnostic Firebase module — auth (all methods), Firestore generic CRUD, Firebase AI, Riverpod providers, and pluggable adapters.
version: 2.0.0
publish_to: "none"
repository: https://example.com/firebase_kit

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter

  # Firebase core SDKs (always required)
  firebase_core: ^5.2.0
  firebase_auth: ^7.1.0
  cloud_firestore: ^7.2.0

  # Firebase AI Logic (Vertex AI in Firebase / Gemini)
  firebase_ai: ^5.2.0

  # State management
  flutter_riverpod: ^3.1.0

  # Functional / data
  dartz: ^0.10.1
  equatable: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  material_ui: ^1.11.1

flutter:
