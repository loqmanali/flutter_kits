name: toast_kit
description: A project-agnostic toast/notification kit — queued, deduped, theme-able, with a frame-occlusion-safe auto-dismiss timer. No host-app coupling.
version: 0.2.0
publish_to: "none"

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
