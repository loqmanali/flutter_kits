name: toast_kit
description: A project-agnostic toast/notification kit — queued, deduped, theme-able, with a frame-occlusion-safe auto-dismiss timer. No host-app coupling.
version: 0.1.0
publish_to: "none"

environment:
  sdk: ">=3.9.0 <4.0.0"
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
